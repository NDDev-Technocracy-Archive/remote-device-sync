# cargo-deny policy for remote-device-sync.
# Run: `cargo deny check`. CI runs
# `cargo deny check bans licenses advisories sources` (rust-supply-chain).

[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # CDLA-Permissive-2.0: webpki-roots/webpki-root-certs (Mozilla root
    # store data) via rustls-platform-verifier/iroh-relay.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    # Unlicense: ws_stream_wasm/async_io_stream/pharos via iroh-relay.
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

# Embedded, unmodified UI fonts only. Their exact upstream notices are retained
# under rds-desktop/assets/font-licenses, displayed in the workspace, and copied
# into the native app bundle. Do not allow these licenses for unrelated crates.
[[licenses.exceptions]]
name = "epaint_default_fonts"
version = "=0.37.0"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
# Cargo.lock is committed; advisories gate on it.
db-path = "~/.cargo/advisory-db"
ignore = [
    # atomic-polyfill (unmaintained) via heapless <- postcard: no safe
    # upgrade exists; severity is informational, not a vulnerability.
    "RUSTSEC-2023-0089",
    # paste (unmaintained) via netlink-packet-core <- netwatch <- iroh:
    # no safe upgrade exists; informational only.
    "RUSTSEC-2024-0436",
]
