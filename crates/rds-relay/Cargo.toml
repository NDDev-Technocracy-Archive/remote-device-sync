[package]
name = "rds-relay"
description = "RDS relay server: packet forwarding for endpoints behind hard NAT"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rds-observe = { workspace = true, features = ["cli"] }
anyhow.workspace = true
clap.workspace = true
iroh.workspace = true
iroh-relay = { workspace = true, features = ["server"] }
rds-core.workspace = true
rds-net = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs"] }
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing-subscriber.workspace = true
noq.workspace = true
ed25519-dalek.workspace = true
rds-discovery.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }

[features]
default = []
## Owned relay server on rds-net's noq backend (WS2).
owned-relay = ["dep:rds-net", "rds-net/transport-noq"]

[lints]
workspace = true
