[package]
name = "rds-net"
description = "Network layer for rds: endpoint lifecycle, identity, tickets, transport backends"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
blake3 = { workspace = true, optional = true }
bytes.workspace = true
data-encoding.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
iroh.workspace = true
noq = { workspace = true, optional = true }
# Non-optional: iroh runs on noq internally, so it is in the tree either
# way — needed for transport tuning (BBRv3, windows) on the iroh backend.
noq-proto.workspace = true
# Non-optional: the announce loop's publish-retry jitter uses it, which is
# on in every build — and iroh/noq already pull rand transitively anyway.
rand.workspace = true
postcard = { workspace = true, features = ["alloc", "use-std"] }
rds-core.workspace = true
rds-discovery.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustix = { workspace = true, features = ["process"] }
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
n0-watcher = "1.0.0"
iroh-base = "=1.4.1"
iroh-relay = { workspace = true, features = ["server"] }
proptest.workspace = true
turmoil = "0.7.2"

[features]
default = []
## Prometheus text exposition for the metrics registry (WS7). The
## counters themselves are always live; this gates only the scrape
## format — no external metrics dependency.
metrics = []
## Owned transport backend on noq (WS1). Off by default until C1 parity.
transport-noq = [
    "dep:noq",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:blake3",
]

[lints]
workspace = true
