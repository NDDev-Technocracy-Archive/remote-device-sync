[package]
name = "rds-bench"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Benchmark and checkpoint harness for rds: scenario runner, UDP impairment proxy, machine-readable reports. Dev tooling, never shipped."

[features]
default = []
## Owned transport backend for `--backend noq` runs (WS1) plus the
## socket-level impairment socket and the owned relay used by tests.
transport-noq = ["rds-net/transport-noq", "dep:noq", "dep:rds-relay"]

[dependencies]
rds-observe.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
iroh-relay = { workspace = true, features = ["server"] }
noq = { workspace = true, optional = true }
rds-agent.workspace = true
rds-relay = { workspace = true, optional = true, features = ["owned-relay"] }
rds-cli.workspace = true
rds-discovery.workspace = true
rds-net.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
