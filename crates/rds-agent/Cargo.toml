[package]
name = "rds-agent"
description = "Daemon on a controlled device: accepts rds connections and serves ssh/desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
desktop = ["dep:rds-desktop", "rds-desktop/x11"]
## Owned transport backend for e2e and `--backend noq` selection (WS1).
transport-noq = ["rds-net/transport-noq"]

[dependencies]
rds-client.workspace = true
rds-observe = { workspace = true, features = ["cli"] }
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
rds-core.workspace = true
rds-desktop = { workspace = true, optional = true }
rds-net.workspace = true
rds-discovery.workspace = true
rds-sync.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
rustix = { workspace = true, features = ["process"] }
iroh-relay = { workspace = true, features = ["server"] }
rand = { workspace = true }
rds-cli = { path = "../rds-cli" }

[lints]
workspace = true
