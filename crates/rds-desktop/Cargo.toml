[package]
name = "rds-desktop"
description = "Desktop session pipeline for rds: capture, encode, input, decode"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
x11 = ["dep:x11rb", "dep:openh264", "dep:openh264-sys2", "dep:memmap2", "dep:rustix"]
portal = ["x11", "dep:ashpd", "dep:pipewire", "dep:reis", "dep:futures-util", "dep:serde_json"]
viewer = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:wayland-backend", "dep:wayland-client", "dep:wayland-protocols"]

[dependencies]
blake3.workspace = true
bytes.workspace = true
rand.workspace = true
memmap2 = { version = "0.9", optional = true }
openh264 = { version = "0.9", optional = true }
# Already supplied by openh264; its typed native options expose live rate
# updates without restarting the encoder and breaking its reference chain.
openh264-sys2 = { version = "0.9", default-features = false, optional = true }
rds-core.workspace = true
rds-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x11rb = { version = "0.14", features = ["shm", "xtest", "xfixes", "damage", "xkb", "randr"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"], optional = true }
# Native window/input only; client-side Adwaita decorations unnecessarily pull
# font parsers into the desktop client. Use the window system's decorations.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }
pollster = { version = "1.0", optional = true }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"], optional = true }
egui-wgpu = { version = "0.36.2", default-features = false, optional = true }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard", "x11", "wayland"], optional = true }
serde.workspace = true
rustix = { workspace = true, features = ["event", "time", "process"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3.17", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31.15", features = ["system", "dlopen"], optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"], optional = true }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"], optional = true }
pipewire = { version = "=0.10.1", optional = true }
reis = { version = "=0.7.1", features = ["tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
serde_json = { workspace = true, optional = true }

# Thin AppKit bindings for the native viewer's window, clipboard and activity
# lifetime. Explicit superclass features are required by the 0.3 bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSAlert", "NSButton", "NSControl", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSProcessInfo"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
noq.workspace = true
rds-bench = { workspace = true, features = ["transport-noq"] }
rds-sync.workspace = true

[lints]
workspace = true

[[example]]
name = "native_clipboard"
required-features = ["viewer"]

[[example]]
name = "workspace_preview"
required-features = ["viewer"]

[[example]]
name = "synthetic_decode_probe"
required-features = ["x11"]

[[example]]
name = "wayland_check"
required-features = ["portal"]
