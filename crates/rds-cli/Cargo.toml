[package]
name = "rds-cli"
description = "Operator CLI for remote device access over the rds transport"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
desktop = ["dep:rds-desktop", "rds-desktop/x11", "rds-desktop/viewer"]
## Owned transport backend for `--backend noq` selection (WS1).
transport-noq = ["rds-net/transport-noq"]

[dependencies]
rds-client.workspace = true
rds-observe.workspace = true
anyhow.workspace = true
clap.workspace = true
rand.workspace = true
rds-core.workspace = true
rds-desktop = { workspace = true, optional = true }
rds-net.workspace = true
rds-discovery.workspace = true
rds-sync.workspace = true
rds-ssh.workspace = true
rustix = { workspace = true, features = ["fs", "termios", "event"] }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize = "1"

[dev-dependencies]
png.workspace = true
iroh.workspace = true
russh.workspace = true
rds-agent.workspace = true
rustix = { workspace = true, features = ["pty"] }

[[bin]]
name = "rds"
path = "src/main.rs"

[[bin]]
name = "nddev-remote"
path = "src/viewer_main.rs"
required-features = ["desktop"]

[[example]]
name = "workspace_managed_preview"
required-features = ["desktop"]

[[example]]
name = "native_owned_input"
required-features = ["desktop"]

[[example]]
name = "native_owned_snapshot"
required-features = ["desktop"]

[lints]
workspace = true
