[workspace]
exclude = ["vendor/iroh", "vendor/noq", "vendor/noq-proto"]
resolver = "3"
members = [
    "crates/rds-agent",
    "crates/rds-bench",
    "crates/rds-audio",
    "crates/rds-cli",
    "crates/rds-client",
    "crates/rds-core",
    "crates/rds-desktop",
    "crates/rds-discovery",
    "crates/rds-net",
    "crates/rds-observe",
    "crates/rds-relay",
    "crates/rds-server",
    "crates/rds-ssh",
    "crates/rds-sync",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-OpenNetwork/remote-device-sync"

# Dependency direction (enforced by convention, not by cargo):
#   rds-core      leaf: types, framing, tokens — no io, no async runtime
#   rds-observe   logging adapter; no product-crate dependencies
#   rds-discovery → core types (own identity layer)
#   rds-net       → rds-core, rds-discovery
#   rds-relay     → rds-core, rds-net
#   rds-audio     → rds-core
#   rds-sync      → rds-core, rds-net
#   rds-desktop   → rds-core, rds-net
#   rds-client    → rds-core, rds-net, rds-discovery (outgoing sessions and local IPC)
#   rds-ssh       → standard SSH library and async I/O (no endpoint ownership)
#   rds-agent     → everything client-facing
#   rds-cli       → everything user-facing
#   rds-server    → rds-relay, rds-discovery

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = "3"
fastcdc = "5"
# unstable-custom-transports is visibility-only: it exposes the path
# selector API so `max_multipath_paths = 1` can actually pin an iroh
# connection to its handshake path (iroh floors the transport-config cap
# at 14 and QNT cannot be disabled through it either).
iroh = { version = "1.3", features = ["unstable-custom-transports"] }
iroh-relay = "1.3"
noq = "1"
noq-proto = "1"
opus = { version = "=0.4.0" }
postcard = "1"
proptest = "1"
rand = "0.10"
redb = "4.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustix = { version = "1", features = ["fs"] }
# Pinned exactly: the release carries PTY encoding, sensitive-debug
# redaction, KEX/parser fixes and stalled-write timeout enforcement that
# the SSH surface relies on (docs/ssh.md).
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
# No tls12: every TLS peer in the estate is our own rustls binary and
# QUIC is 1.3-only anyway — 1.2 has no legitimate client here.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "ring"] }
rustls-pki-types = { version = "1", features = ["alloc"] }
rds-agent = { path = "crates/rds-agent" }
rds-audio = { path = "crates/rds-audio" }
rds-bench = { path = "crates/rds-bench" }
rds-cli = { path = "crates/rds-cli" }
rds-client = { path = "crates/rds-client" }
rds-core = { path = "crates/rds-core" }
rds-desktop = { path = "crates/rds-desktop" }
rds-discovery = { path = "crates/rds-discovery" }
rds-net = { path = "crates/rds-net" }
rds-observe = { path = "crates/rds-observe" }
rds-relay = { path = "crates/rds-relay" }
rds-sync = { path = "crates/rds-sync" }
rds-ssh = { path = "crates/rds-ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"

# Shared lint floor — every crate inherits via `[lints] workspace = true`.
# `unsafe_code` stays a warning: FFI backends in rds-desktop must `allow`
# it locally per module; everywhere else unsafe is a review flag.
[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
rust_2018_idioms = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Exact published Iroh1.3 source plus opt-in periodic selector refresh.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
noq = { path = "vendor/noq" }
noq-proto = { path = "vendor/noq-proto" }
