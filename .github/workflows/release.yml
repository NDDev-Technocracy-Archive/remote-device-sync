name: release

# Numeric tags promote exact attested main desktop packages without rebuilding.
# Only the tag path obtains publication credentials; existing releases are immutable.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric version; dispatch must use the matching annotated tag"
        required: true
        type: string

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release contract and bind source
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test*release.py'
          version="$(cat VERSION)"
          tagged=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tagged=(--tagged); fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = "refs/tags/$INPUT_VERSION"
            test "$version" = "$INPUT_VERSION"
          fi
          python3 scripts/release.py check --version "$version" "${tagged[@]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  source:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact tracked source including observability
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          set -euo pipefail
          tagged=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tagged=(--tagged); fi
          python3 scripts/release.py source --version "$VERSION" --out "$RUNNER_TEMP/source-bundle" "${tagged[@]}"
      - name: Source SPDX SBOM with verified Syft
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/syft.tar.gz"
          directory="$RUNNER_TEMP/syft-bin"
          mkdir "$directory"
          curl --disable --fail --show-error --silent --location             --proto '=https' --proto-redir '=https' --tlsv1.2             --max-time 120 --max-filesize 29289629 --output "$archive"             https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          test "$(wc -c < "$archive" | tr -d '[:space:]')" = 29289629
          printf '%s  %s\n' caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$directory" -- syft
          test -f "$directory/syft" && test ! -L "$directory/syft" && test -x "$directory/syft"
          test "$("$directory/syft" version -o json | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 1.52.0
          "$directory/syft" scan "dir:$RUNNER_TEMP/source-bundle/source"             --source-name nddev-remote --source-version "$VERSION"             --output "spdx-json=$RUNNER_TEMP/source-bundle/source-sbom.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: |
            ${{ runner.temp }}/source-bundle/*.tar.gz
            ${{ runner.temp }}/source-bundle/source-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [contract, source]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: read
    env:
      VERSION: ${{ needs.contract.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact successful main source and native producer
        id: producer
        run: |
          set -euo pipefail
          python3 scripts/release.py check --version "$VERSION" --tagged
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)" = "$(git rev-parse "refs/tags/$VERSION")"
          # Required product/supply-chain evidence is from the default branch,
          # on this exact source commit. Missing, ambiguous or failed runs stop.
          gh api --method GET --paginate --slurp "repos/$GH_REPO/actions/runs" \
            -f head_sha="$commit" -f per_page=100 > "$RUNNER_TEMP/checks.json"
          gh api --method GET --paginate --slurp "repos/$GH_REPO/code-scanning/analyses" \
            -f ref=refs/heads/main -f tool_name=CodeQL -f per_page=100 > "$RUNNER_TEMP/analyses.json"
          gh api --method GET --paginate --slurp "repos/$GH_REPO/code-scanning/alerts" \
            -f ref=refs/heads/main -f state=open -f per_page=100 > "$RUNNER_TEMP/alerts.json"
          python3 scripts/release.py evidence --version "$VERSION" --tagged \
            --checks "$RUNNER_TEMP/checks.json" --analyses "$RUNNER_TEMP/analyses.json" \
            --alerts "$RUNNER_TEMP/alerts.json"
          python3 - "$RUNNER_TEMP/checks.json" "$GITHUB_OUTPUT" "$commit" <<'PYTHON'
          import json, sys
          runs = [r for page in json.load(open(sys.argv[1])) for r in page['workflow_runs']]
          selected = [r for r in runs if r['path'] == '.github/workflows/desktop-runtime.yml'
                      and r['head_sha'] == sys.argv[3] and r['event'] == 'push' and r['head_branch'] == 'main']
          assert len(selected) == 1 and selected[0]['conclusion'] == 'success'
          with open(sys.argv[2], 'a') as output:
              output.write('run=' + str(int(selected[0]['id'])) + '\n')
          PYTHON
          # Do not mistake an authentication/network error for a missing release.
          code="$(curl --disable --silent --show-error --output "$RUNNER_TEMP/preflight.json" --write-out '%{http_code}'             --proto '=https' --tlsv1.2 --max-time 60             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GH_REPO/releases/tags/$VERSION")"
          test "$code" = 404
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/incoming
          run-id: ${{ steps.producer.outputs.run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source
          digest-mismatch: error
      - name: Verify native provenance and promote unchanged bytes
        env:
          RUNTIME_RUN: ${{ steps.producer.outputs.run }}
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP/incoming/"desktop-*/*.tar.gz; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/desktop-runtime.yml" \
              --source-ref refs/heads/main --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners
          done
          python3 scripts/desktop_release.py --version "$VERSION" --tagged \
            --incoming "$RUNNER_TEMP/incoming" --source "$RUNNER_TEMP/source" \
            --runtime-run "$RUNTIME_RUN" --out "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c SHA256SUMS)
      - name: Attest archives, inventory and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/release-manifest.json
            ${{ runner.temp }}/dist/SHA256SUMS
      - name: Attest source SBOM (source archive only)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/nddev-remote-${{ needs.contract.outputs.version }}-source.tar.gz
          sbom-path: ${{ runner.temp }}/dist/source-sbom.spdx.json
      - name: Publish complete engineering preview
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)" = "$(git rev-parse "refs/tags/$VERSION")"
          gh release create "$VERSION" --verify-tag --prerelease --latest=false             --title "NDDev Remote $VERSION — engineering preview"             --notes-file "$RUNNER_TEMP/dist/release-notes.md" "$RUNNER_TEMP/dist/"*
      - name: Verify published bytes and provenance
        run: |
          set -euo pipefail
          gh release view "$VERSION" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/published.json"
          python3 - "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/dist" "$VERSION" <<'PY'
          import json, pathlib, sys
          release = json.load(open(sys.argv[1]))
          assert release["tagName"] == sys.argv[3] and release["isPrerelease"] and not release["isDraft"]
          assert sorted(a["name"] for a in release["assets"]) == sorted(p.name for p in pathlib.Path(sys.argv[2]).iterdir())
          PY
          gh release download "$VERSION" --dir "$RUNNER_TEMP/downloaded"
          cmp "$RUNNER_TEMP/dist/SHA256SUMS" "$RUNNER_TEMP/downloaded/SHA256SUMS"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c SHA256SUMS)
          for asset in "$RUNNER_TEMP/downloaded/"*.tar.gz "$RUNNER_TEMP/downloaded/release-manifest.json" "$RUNNER_TEMP/downloaded/SHA256SUMS"; do
            gh attestation verify "$asset" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"               --source-ref "$GITHUB_REF" --source-digest "$(git rev-parse HEAD)" --deny-self-hosted-runners
          done
