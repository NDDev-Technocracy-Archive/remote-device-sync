name: desktop-runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cache_key: linux_x64
            features: rds-cli/desktop,rds-cli/transport-noq,rds-agent/portal,rds-agent/transport-noq
          - runner: macos-26
            target: aarch64-apple-darwin
            cache_key: macos_arm64
            features: rds-cli/desktop,rds-cli/transport-noq,rds-agent/desktop,rds-agent/transport-noq
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the repository toolchain
        run: rustup show active-toolchain
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          ecosystems: cargo
          key: ${{ matrix.cache_key }}
      - name: Install the Linux portal ABI
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - name: Build desktop executables
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          cargo build --locked --release --target "$TARGET" -p rds-cli -p rds-agent --bins --features "$FEATURES"
      - name: Check native desktop adapters
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          rustup component add clippy
          cargo clippy --locked -p rds-agent -p rds-desktop -p rds-cli --all-targets --features "$FEATURES" -- -D warnings
          cargo test --locked -p rds-desktop -p rds-agent --lib --bins --features "$FEATURES"
      - name: Check native entrypoints and package exact bytes
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          "target/$TARGET/release/rds" desktop --help > /dev/null
          "target/$TARGET/release/rds-agent" --help > /dev/null
          "target/$TARGET/release/nddev-remote" --help > /dev/null
          python3 scripts/package-desktop-runtime.py --binary-dir "target/$TARGET/release" \
            --target "$TARGET" --features "$FEATURES" --out "$RUNNER_TEMP/desktop-runtime"
      - name: Package macOS applications
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/package-macos-apps.py --binary-dir "target/$TARGET/release" \
            --build-info "$RUNNER_TEMP/desktop-runtime/build-info.json" --out "$RUNNER_TEMP/desktop-runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-runtime/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop-runtime
          digest-mismatch: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/desktop-runtime/**/*.tar.gz
