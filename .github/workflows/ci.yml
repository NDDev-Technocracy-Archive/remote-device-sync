name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test lanes build the workspace under seven feature sets; with full debuginfo their
# target tree outgrew the hosted runner's disk. CI keeps no debuginfo, as the NDS modules do.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9d59594f4582fd6c8c3439d8a3c4e8e25639ad43
    permissions:
      contents: read
    with:
      setup: true
      rust-version: '1.99.1'
      rust-components: rustfmt,clippy
      tool-assets: packaging/ci-linux-tools.json
      timeout-minutes: 60

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - name: Clippy
      shell: bash
      run: |
        cargo clippy --locked --workspace --all-targets --features rds-net/transport-noq,rds-agent/transport-noq,rds-cli/transport-noq,rds-bench/transport-noq,rds-relay/owned-relay,rds-server/owned-relay -- -D warnings && cargo clippy --locked -p rds-net --all-targets --features metrics -- -D warnings && cargo clippy --locked --workspace --all-targets --features rds-desktop/x11 -- -D warnings && cargo clippy --locked --workspace --all-targets --features rds-agent/desktop,rds-cli/desktop -- -D warnings
  # Optional feature lanes keep separate target trees from the shared default check.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - name: Test
      shell: bash
      run: |
        cargo test --locked --target-dir target --manifest-path vendor/noq-proto/Cargo.toml --lib --no-fail-fast && cargo test --locked -p rds-net -p rds-agent -p rds-cli -p rds-relay -p rds-server --features rds-net/transport-noq,rds-agent/transport-noq,rds-cli/transport-noq,rds-relay/owned-relay,rds-server/owned-relay --no-fail-fast && cargo test --locked -p rds-net --features metrics --test metrics --no-fail-fast && cargo test --locked -p rds-client --features transport-noq --test multiple_desktops --no-fail-fast && cargo test --locked -p rds-desktop -p rds-cli --features rds-cli/desktop --no-fail-fast && { [ "$(uname -s)" != "Linux" ] || { cargo test --locked --workspace --features rds-desktop/x11 --no-fail-fast && xvfb-run -a -s "-noreset -screen 0 1280x720x24 -screen 1 640x480x24" cargo test --locked -p rds-desktop --features x11 -- --ignored --test-threads=1 && xvfb-run -a -s "-noreset -screen 0 1280x720x24 -screen 1 640x480x24" sh -c 'setxkbmap -keycodes xfree86 -layout us,ru && cargo test --locked -p rds-desktop --features x11 --test x11_native native_alt_navigation_resolves_the_actual_xkb_physical_map -- --ignored --exact --test-threads=1'; }; }
  rust-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - name: Test
      shell: bash
      run: |
        cargo test --locked --workspace --no-fail-fast && cargo test --locked --target-dir target --manifest-path vendor/noq-proto/Cargo.toml --lib --no-fail-fast && cargo test --locked -p rds-net -p rds-agent -p rds-cli -p rds-relay -p rds-server --features rds-net/transport-noq,rds-agent/transport-noq,rds-cli/transport-noq,rds-relay/owned-relay,rds-server/owned-relay --no-fail-fast && cargo test --locked -p rds-net --features metrics --test metrics --no-fail-fast && cargo test --locked -p rds-client --features transport-noq --test multiple_desktops --no-fail-fast && cargo test --locked -p rds-desktop -p rds-cli --features rds-cli/desktop --no-fail-fast && { [ "$(uname -s)" != "Linux" ] || { cargo test --locked --workspace --features rds-desktop/x11 --no-fail-fast && xvfb-run -a -s "-noreset -screen 0 1280x720x24 -screen 1 640x480x24" cargo test --locked -p rds-desktop --features x11 -- --ignored --test-threads=1 && xvfb-run -a -s "-noreset -screen 0 1280x720x24 -screen 1 640x480x24" sh -c 'setxkbmap -keycodes xfree86 -layout us,ru && cargo test --locked -p rds-desktop --features x11 --test x11_native native_alt_navigation_resolves_the_actual_xkb_physical_map -- --ignored --exact --test-threads=1'; }; }
  portal:
    name: Wayland portal boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Select the repository toolchain
      run: rustup show active-toolchain
    - name: Install PipeWire ABI and bindgen headers
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libspa-0.2-dev libclang-dev dbus-daemon
    - name: Check portal and agent ownership
      run: cargo clippy --locked -p rds-agent -p rds-desktop --all-targets --features rds-agent/portal -- -D warnings
    - name: Exercise EI socket and filesystem boundaries
      run: 'cargo test --locked -p rds-desktop --features portal --lib portal:: -- --test-threads=1'
    - name: Exercise serving regressions with the portal build
      run: cargo test --locked -p rds-agent --features portal --lib
