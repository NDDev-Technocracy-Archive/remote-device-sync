name: observability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
        echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
      with:
        ecosystems: cargo
    - name: Format
      shell: bash
      run: |
        cargo fmt --all -- --check
    - name: Clippy
      shell: bash
      run: |
        cargo clippy --locked -p rds-observe --all-targets -- -D warnings
    - name: Build
      shell: bash
      run: |
        cargo build --locked -p rds-observe --example fixture
    - name: Test
      shell: bash
      run: |
        bash -euo pipefail -c ' . ops/observability/images.env; pull_image() {
          for delay in 0 10 30; do
            sleep "$delay";
            if timeout 120 docker pull "$1"; then return 0; fi;
          done;
          return 1;
        }; pull_image "$RDS_VECTOR_IMAGE"; pull_image "$RDS_OPENOBSERVE_IMAGE"; cargo build --locked -p rds-observe --example fixture; cargo test --locked -p rds-observe --test pipeline -- --ignored --nocapture'
