name: observability

on:
  pull_request:
    paths:
      - "crates/rds-observe/**"
      - "ops/observability/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/observability.yml"
  push:
    branches: [main]
    paths:
      - "crates/rds-observe/**"
      - "ops/observability/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/observability.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    permissions:
      contents: read
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/rust-ci.yml@eb41cf80c18110781ef5aa400109a7359f9cba9c # commit:93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      runner: ubuntu-latest
      toolchain: "1.98.1"
      components: "clippy,rustfmt"
      build_command: "cargo build --locked -p rds-observe --example fixture"
      test_matrix_os: '["ubuntu-latest"]'
      test_command: >-
        bash -euo pipefail -c '
        . ops/observability/images.env;
        pull_image() {
          for delay in 0 10 30; do
            sleep "$delay";
            if timeout 120 docker pull "$1"; then return 0; fi;
          done;
          return 1;
        };
        pull_image "$RDS_VECTOR_IMAGE";
        pull_image "$RDS_OPENOBSERVE_IMAGE";
        cargo build --locked -p rds-observe --example fixture;
        cargo test --locked -p rds-observe --test pipeline -- --ignored --nocapture'
      fmt_command: "cargo fmt --all -- --check"
      clippy_command: "cargo clippy --locked -p rds-observe --all-targets -- -D warnings"
      timeout_minutes: 20
