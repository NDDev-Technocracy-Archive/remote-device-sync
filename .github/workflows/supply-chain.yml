name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup toolchain install 1.98.1 --profile minimal
        echo RUSTUP_TOOLCHAIN=1.98.1 >> "$GITHUB_ENV"
    - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
      with:
        capability: rust
    - name: Supply chain
      shell: bash
      run: |
        cargo deny --manifest-path ./Cargo.toml --all-features --config deny.toml check bans licenses advisories sources
        (cd . && cargo audit)
        (cd . && cargo-machete --skip-metadata-dir)
