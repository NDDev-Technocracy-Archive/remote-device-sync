name: supply-chain

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Disable external telemetry
      uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Prepare the declared Rust SDK
      uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      with:
        rust-version: "1.99.1"
        rust-components: rustfmt,clippy
    - name: Prepare supply-chain tools
      uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      with:
        tools: cargo-deny@0.20.2,cargo-audit@0.22.2
    # cargo-machete is not run: in the retired library it never executed (an unsupported flag was
    # swallowed by `|| true`), and a real run reports unused dependencies the product must remove first.
    - name: Supply chain
      shell: bash
      run: |
        cargo deny --manifest-path ./Cargo.toml --all-features --config deny.toml check bans licenses advisories sources
        (cd . && cargo audit --db "$RUNNER_TEMP/rustsec-advisory-db")
