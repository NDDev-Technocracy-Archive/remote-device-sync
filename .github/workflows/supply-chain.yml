name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9d59594f4582fd6c8c3439d8a3c4e8e25639ad43
      with:
        manifest: packaging/ci-linux-tools.json
        directory: ${{ runner.temp }}/nddev-remote-tools
        add-to-path: true
    - name: Supply chain
      shell: bash
      run: |
        cargo deny --manifest-path ./Cargo.toml --all-features --config deny.toml check bans licenses advisories sources
