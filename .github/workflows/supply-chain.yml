name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
      with:
        tools: cargo-deny@0.20.2
    - name: Install cargo-audit 0.23.0, checked against their digests
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"; mkdir -p "$bin"
        curl -fsSL -o "$RUNNER_TEMP/cargo-audit.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz"
        echo "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$bin" --strip-components=1 "cargo-audit-x86_64-unknown-linux-musl-v0.23.0/cargo-audit"
        echo "$bin" >> "$GITHUB_PATH"
    # cargo-machete is not run: in the retired library it never executed (an unsupported flag was
    # swallowed by `|| true`), and a real run reports unused dependencies the product must remove first.
    - name: Supply chain
      shell: bash
      run: |
        cargo deny --manifest-path ./Cargo.toml --all-features --config deny.toml check bans licenses advisories sources
        (cd . && cargo audit --db "$RUNNER_TEMP/rustsec-advisory-db")
